<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function solution(number, k) {
        let arr = [];

        for (let i = 0; i < number.length; i++) {
          let num = number[i];
          while (k > 0 && arr.length && arr[arr.length - 1] < num) {
            arr.pop();
            k--;
          }

          arr.push(num);
        }
        if (k > 0) {
          arr.splice(arr.length - k, k);
        }

        return arr.join("");
      }

      console.log(solution("4177250841", 8));
    </script>
  </body>
</html>
