<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function solution(name) {
        var answer = 0;
        const len = name.length;

        // 세로 이동 (각 문자 변경 비용 계산)
        for (let i = 0; i < len; i++) {
          const charCode = name.charCodeAt(i);
          answer += Math.min(charCode - 65, 91 - charCode); // A=65, Z=90
        }

        // 가로 이동 최소값 계산
        let move = len - 1; // 최악의 경우: 끝까지 가는 경우

        for (let i = 0; i < len; i++) {
          let next = i + 1;
          while (next < len && name[next] === "A") {
            next++;
          }
          // i까지 가서 뒤로 돌아가는 경우와 비교
          move = Math.min(move, i + i + (len - next));
          // 또는 뒤로 갔다가 앞으로 가는 경우와 비교
          move = Math.min(move, (len - next) * 2 + i);
        }

        return answer + move;
      }

      console.log(solution("ABAAAAAAAAABB"));
    </script>
  </body>
</html>
