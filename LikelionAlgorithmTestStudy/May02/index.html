      // 가능한 모든 조합을 구하는 함수
      function allComb(arr, num) {
        var results = [];
        if (num === 1) return arr.map((val) => [val]);
        for (let i = 0; i < arr.length; i++) {
          var fixed = arr[i];
          var newArr = arr.slice(i + 1);
          console.log(i, fixed, newArr);
          // 재귀 함수 시작
          var combinations = allComb(newArr, num - 1);
          var attached = combinations.map((elem) => [fixed, ...elem]);
          results.push(...attached);
        }
        return results;
      }

      function isPrime(num) {
