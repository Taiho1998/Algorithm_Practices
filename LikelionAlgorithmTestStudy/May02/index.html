    <script>
      function solution(numbers) {
        var answer = 0;
        // str으로 입력 받으므로 array로 분리 후 int형으로 변환
        var numArr = numbers.split("").map((e) => parseInt(e));

        var allNum = allComb(numArr, numArr.length);
        allNum.forEach((element) => {
          if (isPrime(element)) answer++;
        });
        return answer;
      }

      function allComb(arr, num) {
        var results = [];
        if (num === 1) return arr.map((val) => [val]);
        for (let i = 0; i < arr.length; i++) {
          var fixed = arr[i];
          var newArr = [...arr.slice(0, i), ...arr.slice(i + 1)];
          var combinations = allComb(newArr, num - 1); // [ [1, 0], [0, 1], ... ]
          var attached = combinations.map((elem) => [fixed, ...elem]); // [ [1,1,0], ... ]
          results.push(...attached); // 배열만 push
        }
        return results;
      }

      function isPrime(num) {
        for (var i = 2; i < Math.sqrt(num); i++) {
          if (num % i === 0) return true;
        }
        return false;
      }

      console.log(solution("011"));
