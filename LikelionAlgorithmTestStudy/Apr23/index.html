<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // 전체 학생 수 n, 체육복을 잃어버린 학생 lost, 체육복 여분을 가진 reserve
      // 바로 앞 아니면 바로 뒷 번호만 빌려줄 수 있음
      function solution(n, lost, reserve) {
        var answer = 0;
        var array = new Array(n);
        lost.sort((a, b) => a - b);
        reserve.sort((a, b) => a - b);
        array.fill(1);
        lost.forEach((i) => array[i - 1]--);
        reserve.forEach((i) => array[i - 1]++);
        for (let i = 0; i < n; i++) {
          if (array[i] === 0) {
            if (i > 0 && array[i - 1] === 2) {
              array[i - 1] -= 1;
              array[i] += 1;
            } else if (array[i + 1] === 2) {
              array[i + 1] -= 1;
              array[i] += 1;
            }
          }
        }
        for (let i of array) answer = i !== 0 ? answer + 1 : answer;
        return answer;
      }

      console.log(solution(5, [3, 4], [1, 2, 5]));
    </script>
  </body>
</html>
