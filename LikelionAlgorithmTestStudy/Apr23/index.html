<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // 전체 학생 수 n, 체육복을 잃어버린 학생 lost, 체육복 여분을 가진 reserve
      // 바로 앞 아니면 바로 뒷 번호만 빌려줄 수 있음
      function solution(n, lost, reserve) {
        var answer = n;
        for (let i of lost) {
          if (reverse) {
            if (reserve.includes(i + 1)) {
              reserve = reserve.filter((a) => a !== i + 1);
              lost = lost.filter((a) => a !== i);
              continue;
            }
            if (lost.includes(i - 1)) {
              reserve = reserve.filter((a) => a !== i - 1);
              lost = lost.filter((a) => a !== i);
            }
          } else {
            if (reserve.includes(i - 1)) {
              reserve = reserve.filter((a) => a !== i - 1);
              lost = lost.filter((a) => a !== i);
              continue;
            }
            if (lost.includes(i + 1)) {
              reserve = reserve.filter((a) => a !== i + 1);
              lost = lost.filter((a) => a !== i);
            }
          }
        }
        answer = n - lost.length;
        return answer;
      }
    </script>
  </body>
</html>
